<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><link rel="canonical" href="https://davidyep.github.io/learn-co-sandbox/commutervanapp/"><title>Commuter Van Passenger Counter · Live</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:440px;margin:auto;padding:20px 24px 32px}header{text-align:center}h1{font-size:28px;margin:8px 0 4px}.subtitle{font-size:13px;color:#666;margin:0 0 22px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}input,button{font:inherit}input{width:100%;font-size:16px;padding:12px;border:1px solid #d4d7dd;border-radius:9px;background:white;min-height:46px;margin-bottom:12px}
button{border:0;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #007aff;outline-offset:4px}
input[aria-invalid="true"]{border-color:#ff3b30;box-shadow:0 0 0 4px rgba(255,59,48,.18)}input[aria-invalid="true"]:focus-visible{outline-color:#ff3b30}
.action{width:100%;min-height:46px;padding:12px;background:#007aff;color:white;border-radius:9px;font-weight:600}
#state{font-size:12px;color:#666;text-align:center;margin:14px 0 4px}
.counter{text-align:center;padding:12px 0 18px}.counter+.counter{border-top:1px solid #eee}h2{font-size:18px;margin:0 0 2px;font-weight:650}.hint{font-size:12px;color:#777;margin:0}.total{font-size:60px;font-weight:700;line-height:1.1;margin:8px 0 12px;font-variant-numeric:tabular-nums}
.controls{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:320px;gap:48px;margin:auto}
.circle{display:flex;align-items:center;justify-content:center;flex:0 0 72px;width:72px;height:72px;border-radius:50%;padding:0;font-size:32px;font-weight:400;color:white;line-height:1}.minus{background:#ff3b30}.plus{background:#34c759}.circle:active:not(:disabled){transform:scale(.94)}
.session-actions{display:flex;gap:14px;margin-top:6px;align-items:stretch}#reset{background:#007aff;color:#fff;font-size:17px;padding:12px 16px;border-radius:9px;min-height:48px;white-space:nowrap}.session-actions .action{flex:1}
#message{min-height:36px;color:#555;font-size:13px;line-height:1.4;margin:12px 0}footer{border-top:1px solid #eee;padding-top:12px;color:#666;font-size:12px;line-height:1.5}#summary{margin:0 0 12px}
#export{width:100%;min-height:44px;background:#f2f2f7;color:#005bbf;border-radius:9px;font-weight:600;font-size:14px}small{display:block;margin:12px 0}a{color:#0066cc}
</style></head><body><main>
<header><h1>Commuter Van Passenger Counter</h1><p class="subtitle">Boarding + Exiting · Shared live data</p></header>
<label for="initials">Staff initials</label><input id="initials" maxlength="12" placeholder="Enter your initials" autocomplete="off" autocapitalize="characters" spellcheck="false">
<label for="location">Survey location</label><input id="location" list="locations" maxlength="200" placeholder="Enter intersection or survey site" autocomplete="off"><datalist id="locations"></datalist>
<button id="start" class="action">Start Count</button><p id="state"></p>
<section class="counter" aria-labelledby="boarding-heading"><h2 id="boarding-heading">Boarding</h2><p class="hint">Getting onto the van</p><div class="total" id="boarding-total">0</div><div class="controls"><button class="circle minus" id="boarding-minus" disabled aria-label="Subtract last boarding passenger">−</button><button class="circle plus" id="boarding-plus" disabled aria-label="Add boarding passenger">+</button></div></section>
<section class="counter" aria-labelledby="exiting-heading"><h2 id="exiting-heading">Exiting</h2><p class="hint">Getting off the van</p><div class="total" id="exiting-total">0</div><div class="controls"><button class="circle minus" id="exiting-minus" disabled aria-label="Subtract last exiting passenger">−</button><button class="circle plus" id="exiting-plus" disabled aria-label="Add exiting passenger">+</button></div></section>
<div class="session-actions"><button id="reset" disabled>Reset Both</button><button id="finish" class="action" disabled>Finish Count</button></div>
<p id="message" role="status" aria-live="polite"></p><footer><p id="summary"></p><button id="export" disabled>Export Records · CSV</button><small>Each finished count is saved to the shared database. If service drops, it stays on this device and retries automatically.</small></footer>
</main><script>
"use strict";
const $=id=>document.getElementById(id);
const KEY="nyc-pax-live-v1";
const SUPABASE_URL="https://bfbcwiqffwzoaocyityk.supabase.co";
const SUPABASE_KEY="sb_publishable_J2QxCWP70SvqluQduvWUig_UCQRAuOx";
let data={sessions:[],events:[]},blocked=false,syncing=false;
const now=()=>new Date().toISOString(),uid=()=>crypto.randomUUID();
const active=()=>data.sessions.find(s=>!s.finished);
const taps=(s,mode)=>s?data.events.filter(e=>e.sessionId===s.id&&e.type==="passenger"&&e.mode===mode&&!e.voided):[];
const total=(s,mode)=>taps(s,mode).length;
function nycTimestamp(at){
 const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(new Date(at)).filter(x=>x.type!=="literal").map(x=>[x.type,x.value]));
 return p.year+"-"+p.month+"-"+p.day+" "+p.hour+":"+p.minute+":"+p.second;
}
function validate(d){
 if(!d||!Array.isArray(d.sessions)||!Array.isArray(d.events))throw Error("Invalid data");
 if(d.sessions.filter(s=>!s.finished).length>1)throw Error("Multiple sessions");
 const ids=new Set(d.sessions.map(s=>s.id));
 if(d.sessions.some(s=>!s.id||!s.location||!s.started)||d.events.some(e=>!ids.has(e.sessionId)||!e.id||!e.at))throw Error("Invalid records");
 return d;
}
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
try{const saved=localStorage.getItem(KEY);if(saved)data=validate(JSON.parse(saved))}
catch{blocked=true;$("message").textContent="Cannot open saved records. Counting is paused to protect them."}
function log(s,type,mode,at,extra={}){data.events.push({id:uid(),sessionId:s.id,type,mode,at,...extra})}
function save(fn,message){
 if(blocked)return;
 const previous=JSON.stringify(data);
 try{fn();persist();$("message").textContent=message}
 catch{data=JSON.parse(previous);$("message").textContent="Could not save this action. It was not applied."}
 render();
}
function rowsFor(s){
 const rows=[];
 for(const mode of ["boarding","exiting"]){
  for(const e of taps(s,mode))rows.push({observation_id:e.id,session_id:s.id,staff_initials:s.staffInitials||null,location:s.location,type:mode,timestamp_utc:e.at,timestamp_nyc:nycTimestamp(e.at),count:1});
 }
 return rows;
}
async function syncSession(s){
 if(!s.finished||s.synced_at)return true;
 const rows=rowsFor(s);
 if(!rows.length){s.synced_at=now();persist();return true}
 const response=await fetch(SUPABASE_URL+"/rest/v1/passenger_observations",{
  method:"POST",
  headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
  body:JSON.stringify(rows)
 });
 if(!response.ok){
  const detail=await response.text();
  let duplicate=false;
  try{duplicate=response.status===409&&JSON.parse(detail).code==="23505"}catch{}
  if(!duplicate)throw Error("Database returned "+response.status+": "+detail);
 }
 s.synced_at=now();persist();return true;
}
async function syncPending(){
 if(syncing||blocked||!navigator.onLine)return;
 const pending=data.sessions.filter(s=>s.finished&&!s.synced_at);
 if(!pending.length)return;
 syncing=true;render();
 try{
  for(const s of pending)await syncSession(s);
  $("message").textContent=pending.length===1?"Count successfully uploaded to database.":pending.length+" counts successfully uploaded to database.";
 }catch(error){
  console.error("Pax sync failed",error);
  $("message").textContent="Count is saved on this device and waiting to upload. It will retry when service returns.";
 }finally{syncing=false;render()}
}
function render(){
 const s=active();
 $("initials").disabled=$("location").disabled=$("start").disabled=!!s||blocked||syncing;
 if(s){$("initials").value=s.staffInitials||"";$("location").value=s.location}
 $("finish").disabled=!s||blocked||syncing;
 $("reset").disabled=!s||blocked||syncing||!(total(s,"boarding")+total(s,"exiting"));
 for(const mode of ["boarding","exiting"]){
  $(mode+"-total").textContent=total(s,mode);
  $(mode+"-plus").disabled=!s||blocked||syncing;
  $(mode+"-minus").disabled=!s||blocked||syncing||!total(s,mode);
 }
 $("state").textContent=syncing?"Uploading saved count…":s?"Counting · "+(s.staffInitials?s.staffInitials+" · ":"")+"Started "+new Date(s.started).toLocaleTimeString("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit"})+" ET":"Enter your initials and choose a location to start";
 const done=data.sessions.filter(x=>x.finished),pending=done.filter(x=>!x.synced_at).length;
 $("summary").textContent=done.length+" completed sessions · "+done.reduce((n,x)=>n+total(x,"boarding"),0)+" boarded · "+done.reduce((n,x)=>n+total(x,"exiting"),0)+" exited"+(pending?" · "+pending+" waiting to upload":" · All uploaded");
 $("export").disabled=!data.events.some(e=>e.type==="passenger"&&!e.voided);
 $("locations").replaceChildren(...[...new Set(data.sessions.map(x=>x.location))].map(name=>{const o=document.createElement("option");o.value=name;return o}));
}
$("start").onclick=()=>{
 if(active())return;
 const staffInitials=$("initials").value.trim().toUpperCase();
 const location=$("location").value.trim();
 if(!staffInitials){$("initials").setAttribute("aria-invalid","true");$("message").textContent="Enter your staff initials first.";$("initials").focus();return}
 $("initials").removeAttribute("aria-invalid");
 if(!location){$("location").setAttribute("aria-invalid","true");$("message").textContent="Enter the survey location first.";$("location").focus();return}
 $("location").removeAttribute("aria-invalid");
 $("initials").value=staffInitials;
 save(()=>{const at=now(),s={id:uid(),staffInitials,location,started:at,finished:null,synced_at:null};data.sessions.push(s);log(s,"session_started","",at)},"Both counters are ready.");
};
$("initials").addEventListener("input",()=>$("initials").removeAttribute("aria-invalid"));
$("location").addEventListener("input",()=>$("location").removeAttribute("aria-invalid"));
for(const mode of ["boarding","exiting"]){
 $(mode+"-plus").onclick=()=>{const s=active();if(s)save(()=>log(s,"passenger",mode,now()),mode==="boarding"?"Boarding passenger recorded.":"Exiting passenger recorded.")};
 $(mode+"-minus").onclick=()=>{
  const s=active(),last=taps(s,mode).at(-1);if(!last)return;
  save(()=>{const at=now();last.voided=at;log(s,"undo",mode,at,{target:last.id})},"Last "+mode+" passenger removed.");
 };
}
$("reset").onclick=()=>{
 const s=active();if(!s||!confirm("Reset BOTH counters for this session? Completed sessions remain saved."))return;
 save(()=>{const at=now();for(const mode of ["boarding","exiting"])taps(s,mode).forEach(e=>e.voided=at);log(s,"reset","",at)},"Both counts reset. This session is still active.");
};
$("finish").onclick=()=>{
 const s=active();if(!s)return;
 const boarding=total(s,"boarding"),exiting=total(s,"exiting");
 save(()=>{s.finished=now();log(s,"session_finished","",s.finished)},"Saved: "+boarding+" boarded and "+exiting+" exited. Uploading…");
 syncPending();
};
$("export").onclick=()=>{
 const rows=[["session_id","staff_initials","location","type","timestamp_nyc","count"]];
 for(const s of data.sessions)for(const r of rowsFor(s))rows.push([r.session_id,s.staffInitials||"",r.location,r.type,r.timestamp_nyc,r.count]);
 const cell=v=>{let t=String(v);if(/^[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"'};
 const csv="\uFEFF"+rows.map(row=>row.map(cell).join(",")).join("\r\n"),url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");
 a.href=url;a.download="pax-live-"+now().slice(0,10)+".csv";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
window.addEventListener("online",syncPending);
window.addEventListener("storage",e=>{if(e.key!==KEY&&e.key!==null)return;blocked=true;$("message").textContent="Records changed in another tab. Reload before counting here.";render()});
render();syncPending();
</script></body></html>
